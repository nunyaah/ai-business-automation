name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test ${{ matrix.agent }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [invoice-agent, lead-qualifier, ticket-triage]

    steps:
      - uses: actions/checkout@v4

      - name: Check agent exists
        id: check
        run: |
          if [ -f "${{ matrix.agent }}/requirements.txt" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::${{ matrix.agent }} not yet implemented — skipping"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ${{ matrix.agent }}/requirements.txt

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.agent }}
        run: pip install -r requirements.txt

      - name: Run tests
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.agent }}
        run: pytest tests/ -v
